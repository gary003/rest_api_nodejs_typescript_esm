name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  NODE_VERSION: 24
  DOCKER_IMAGE: gary003/rest_api_nodejs_typescript_esm
  DOCKER_TAG: latest

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      # Static Analysis - Trivy
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'

      - name: Trivy filesystem scan (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      # Build Docker image
      - name: Build Docker image
        run: npm run docker:build:image

      # Container Scanning - Trivy
      - name: Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}'
          format: 'table'
          exit-code: '0'

      - name: Trivy container scan (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}'
          format: 'sarif'
          output: 'trivy-container.sarif'

      # Start application for DAST
      - name: Start application
        run: npm run start --wait && echo "Application started successfully" || exit 1

      # Dynamic Analysis - OWASP ZAP
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:8080/api'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j'
          fail_action: false
          artifact_name: 'zap-scan-results'
        continue-on-error: true

      # Upload ZAP reports manually with unique name
      - name: Upload ZAP Scan Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report-${{ github.run_number }}
          path: |
            report_html.html
            report_json.json
            report_md.md
          retention-days: 7
          if-no-files-found: warn

      # Show application logs if ZAP scan fails
      - name: Show application logs on failure
        if: failure()
        run: |
          echo "=== Application Logs ==="
          docker compose logs app
          echo ""
          echo "=== Database Logs ==="
          docker compose logs db

      # Stop containers
      - name: Stop containers
        if: always()
        run: docker compose down -v

      # Upload all results to GitHub Security
      - name: Upload Trivy filesystem results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-fs'
        continue-on-error: true

      - name: Upload Trivy container results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-container.sarif'
          category: 'trivy-container'
        continue-on-error: true

      # Check for high severity issues (warning only, don't fail)
      - name: Check for high severity issues
        if: always()
        continue-on-error: true
        run: |
          if [ -f trivy-results.sarif ] && [ -f trivy-container.sarif ]; then
            if grep -q "HIGH\|CRITICAL" trivy-results.sarif trivy-container.sarif; then
              echo "⚠️  High/Critical vulnerabilities found - Review required"
              echo "Check GitHub Security tab for details"
            else
              echo "✅ No High/Critical vulnerabilities found"
            fi
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

  test-app:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run all tests
        run: npm run test:ci
        env:
          CI: true

      - name: Upload test artifacts (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            *.log
            coverage/

  docker-build-image:
    runs-on: ubuntu-latest
    needs: test-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: npm run docker:build:image

      - name: Test Docker image
        run: |
          docker run --rm -d -p 8080:8080 --name test-container ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}

          # Wait for container to be ready
          maxCount=30
          counter=0
          until curl -sf http://localhost:8080/api/health > /dev/null || [ $counter -eq $maxCount ]; do
            echo "Waiting for container... ($counter/$maxCount)"
            sleep 5
            counter=$((counter + 1))
          done

          if [ $counter -eq $maxCount ]; then
            echo "Container failed to start"
            docker logs test-container
            docker stop test-container
            exit 1
          fi

          echo "Container is ready"
          docker stop test-container

  deploy-dockerHub:
    runs-on: ubuntu-latest
    needs: docker-build-image
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
          logout: true

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
